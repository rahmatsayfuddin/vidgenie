<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
</head>
<body>
  <h1>{{ title }}</h1>

  <h2>Upload dari perangkat</h2>
  <form action="/upload" method="post" enctype="multipart/form-data">
    <div>
      <label>Berkas (gambar/video)<br>
        <input type="file" name="file" accept="image/*,video/*" required>
      </label>
    </div>
    <div>
      <label>Deskripsi (AI-friendly, bahasa alami; opsional, langsung auto-embed bila diisi)<br>
        <textarea name="description" rows="4" cols="60"></textarea>
      </label>
    </div>
    <div>
      <label>Tags (pisahkan dengan koma)<br>
        <input type="text" name="tags" size="60">
      </label>
    </div>
    <button type="submit">Upload</button>
  </form>

  <h2>Tambah dari tautan (gambar)</h2>
  <form action="/assets/add-link" method="post">
    <div>
      <label>URL gambar<br>
        <input type="url" name="url" size="60" placeholder="https://..." required>
      </label>
    </div>
    <div>
      <label>Deskripsi (AI-friendly, bahasa alami; wajib)<br>
        <textarea name="description" rows="4" cols="60" required></textarea>
      </label>
    </div>
    <div>
      <label>Tags (pisahkan dengan koma)<br>
        <input type="text" name="tags" size="60">
      </label>
    </div>
    <button type="submit">Tambah via tautan</button>
  </form>

  <h2>Tambah massal dari tautan (JSONL)</h2>
  <form action="/assets/import-batch" method="post">
    <div>
      <label>Baris JSONL (satu per baris; maksimal 200)<br>
        <textarea name="jsonl" rows="6" cols="72"
          placeholder='{"url": "https://.../a.jpg", "description": "pantai senja", "tags": "pantai,senja"}'>{{ batch_jsonl or "" }}</textarea>
      </label>
    </div>
    {% if batch_error %}<p style="color: #c00">{{ batch_error }}</p>{% endif %}
    <button type="submit">Impor massal</button>
  </form>

  <p><a href="/">Kembali</a></p>
</body>
</html>
