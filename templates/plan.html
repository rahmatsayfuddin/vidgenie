<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
</head>
<body>
  <h1>{{ title }}</h1>
  {% if error %}<p style="color: #c00">{{ error }}</p>{% endif %}
  <form action="/plan" method="post">
    <label>Narasi<br>
      <textarea name="narration" rows="8" cols="70" required>{{ narration }}</textarea>
    </label>
    <br><br>
    <button type="submit">Rancang scene</button>
  </form>
  <p><a href="/">Kembali</a></p>
</body>
</html>
