[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidgenie"
version = "0.1.0"
description = "Susun video dari narasi via RAG atas library asset (DAM) + render ffmpeg lokal"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.53",
    "jinja2>=3.1",
    "python-multipart>=0.0.32",
    "httpx>=0.28",
    "pydantic>=2.13",
    "numpy>=2.5",
    "Pillow>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "mypy>=2.3",
]
embedding = ["fastembed>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vidgenie*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
packages = ["vidgenie", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]